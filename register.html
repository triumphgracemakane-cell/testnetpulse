<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Register Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-sky-50 text-sky-600 mb-3 border border-sky-100">
                <i data-lucide="shield-plus" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Create Account</h1>
            <p class="text-slate-500 text-sm mt-1">New registrations require Super Admin or Deputy approval.</p>
        </div>

        <div id="errorBanner" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl"></div>
        <div id="successBanner" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-600 text-sm rounded-xl"></div>

        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-slate-700 text-sm font-medium mb-1">Account Mode</label>
                <select id="accountType" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition" onchange="toggleIndustryField()">
                    <option value="personal">Individual / Personal Use</option>
                    <option value="industrial">Industrial / Enterprise</option>
                </select>
            </div>

            <div id="industryFieldContainer" class="hidden">
                <label class="block text-slate-700 text-sm font-medium mb-1">Industrial Access / License Key</label>
                <input type="text" id="industryCode" placeholder="IND-SECURE-XXXX" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label class="block text-slate-700 text-sm font-medium mb-1">Full Name</label>
                <input type="text" id="name" required placeholder="Triumph-Grace Makane" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label class="block text-slate-700 text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="user@domain.com" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label class="block text-slate-700 text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label class="block text-slate-700 text-sm font-medium mb-1">Requested Role</label>
                <select id="role" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:border-sky-500 transition">
                    <option value="viewer">Viewer</option>
                    <option value="technician">Technician</option>
                    <option value="manager">Manager</option>
                    <option value="deputy_admin">Deputy Admin</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-xl shadow-md transition mt-2">
                Submit Request
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an approved account? <a href="login.html" class="text-sky-600 hover:underline font-medium">Sign In</a>
        </p>
    </div>

    <script>
        lucide.createIcons();

        function toggleIndustryField() {
            const val = document.getElementById('accountType').value;
            const container = document.getElementById('industryFieldContainer');
            if (val === 'industrial') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const errorBanner = document.getElementById('errorBanner');
            const successBanner = document.getElementById('successBanner');
            errorBanner.classList.add('hidden');
            successBanner.classList.add('hidden');

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                accountType: document.getElementById('accountType').value,
                industryCode: document.getElementById('industryCode').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Registration failed.');
                }

                successBanner.textContent = data.message;
                successBanner.classList.remove('hidden');
                document.getElementById('registerForm').reset();
                toggleIndustryField();
            } catch (err) {
                errorBanner.textContent = err.message;
                errorBanner.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
