<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Governance - NetPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
        h1 { font-size: 1.8rem; color: #0f172a; }
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .btn-blue { background: #0284c7; color: #fff; border: none; }
        .btn-blue:hover { background: #0369a1; }
        .btn-danger { background: #ef4444; color: #fff; border: none; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; color: #fff; border: none; }
        .btn-success:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
        th, td { padding: 16px 20px; text-align: left; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; }
        tr:hover { background: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-pending { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .badge-approved { background: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
        .badge-rejected { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        select { background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        select:focus { border-color: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Admin User Governance</h1>
                <p style="color: #64748b; font-size: 0.9rem; margin-top: 5px;">Approve account requests and manage RBAC roles.</p>
            </div>
            <div>
                <a href="dashboard.html" class="btn btn-blue" style="margin-right: 10px;">Back to Dashboard</a>
                <button onclick="localStorage.clear(); window.location.href='login.html';" class="btn btn-danger">Logout</button>
            </div>
        </header>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="5" style="text-align: center; color: #64748b;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || !['super_admin', 'deputy_admin'].includes(role)) {
            alert('Access Denied. Super Admin or Deputy Admin privileges required.');
            window.location.href = 'dashboard.html';
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await res.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${u.name} ${u.is_super ? '👑' : ''}</td>
                        <td>${u.email}</td>
                        <td>
                            <select onchange="updateRole(${u.id}, this.value)" ${u.is_super ? 'disabled' : ''}>
                                <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>Viewer</option>
                                <option value="technician" ${u.role === 'technician' ? 'selected' : ''}>Technician</option>
                                <option value="manager" ${u.role === 'manager' ? 'selected' : ''}>Manager</option>
                                <option value="deputy_admin" ${u.role === 'deputy_admin' ? 'selected' : ''}>Deputy Admin</option>
                            </select>
                        </td>
                        <td><span class="badge badge-${u.status}">${u.status.toUpperCase()}</span></td>
                        <td>
                            ${u.status === 'pending' ? `<button onclick="updateStatus(${u.id}, 'approved')" class="btn btn-success" style="padding: 4px 10px; font-size: 0.8rem; margin-right:5px;">Approve</button>` : ''}
                            ${u.status === 'approved' && !u.is_super ? `<button onclick="updateStatus(${u.id}, 'rejected')" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem; margin-right:5px;">Reject</button>` : ''}
                            ${!u.is_super ? `<button onclick="deleteUser(${u.id})" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;">Delete</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus(id, status) {
            await fetch(`/api/users/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            loadUsers();
        }

        async function updateRole(id, newRole) {
            await fetch(`/api/users/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ role: newRole })
            });
            loadUsers();
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            await fetch(`/api/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
