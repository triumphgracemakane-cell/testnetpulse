<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - NetPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        h2 { font-size: 1.8rem; margin-bottom: 8px; color: #0f172a; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: #475569; }
        input { width: 100%; padding: 12px 16px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; color: #0f172a; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #0284c7; }
        .btn { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; }
        .links { margin-top: 20px; text-align: center; font-size: 0.85rem; color: #64748b; display: flex; justify-content: space-between; }
        .links a { color: #0284c7; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <p>Sign in to access your NetPulse operational dashboard.</p>
        <div id="errorBox" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="admin@dashboard.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="links">
            <a href="register.html">Request Account</a>
            <a href="recover-admin.html">Emergency Recovery</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('errorBox');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('name', data.name);
                localStorage.setItem('is_super', data.is_super);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errBox.style.display = 'block';
                errBox.innerText = err.message;
            }
        });
    </script>
</body>
</html>
