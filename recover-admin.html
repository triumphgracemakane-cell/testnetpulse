<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emergency Super Admin Recovery - NetPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
        h2 { font-size: 1.6rem; margin-bottom: 8px; color: #0f172a; }
        p { color: #64748b; font-size: 0.85rem; margin-bottom: 25px; line-height: 1.5; }
        p code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #0284c7; font-size: 0.8rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: #475569; }
        input { width: 100%; padding: 12px 16px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; color: #0f172a; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #0284c7; }
        .btn { width: 100%; padding: 12px; background: #e11d48; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #be123c; }
        .alert { background: #d1fae5; border: 1px solid #a7f3d0; color: #059669; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; display: none; text-align: center; }
        .alert a { color: #047857; font-weight: 600; text-decoration: underline; }
        .error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; }
        .links { margin-top: 20px; text-align: center; font-size: 0.85rem; }
        .links a { color: #0284c7; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Super Admin Recovery</h2>
        <p>Enter your <code>ADMIN_RECOVERY_KEY</code> from the environment to reset Super Admin credentials.</p>
        <div id="successBox" class="alert">Super Admin reset successful. <a href="login.html">Sign In</a></div>
        <div id="errorBox" class="error"></div>
        <form id="recoverForm">
            <div class="form-group">
                <label>Recovery Key (.env)</label>
                <input type="password" id="recoveryKey" required placeholder="NETPULSE_RECOVERY_KEY_...">
            </div>
            <div class="form-group">
                <label>New Super Admin Email</label>
                <input type="email" id="newEmail" required placeholder="admin@dashboard.com">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Reset Super Admin</button>
        </form>
        <div class="links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
    <script>
        document.getElementById('recoverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const recoveryKey = document.getElementById('recoveryKey').value;
            const newEmail = document.getElementById('newEmail').value;
            const newPassword = document.getElementById('newPassword').value;
            const succBox = document.getElementById('successBox');
            const errBox = document.getElementById('errorBox');

            try {
                const res = await fetch('/api/recover-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recoveryKey, newEmail, newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                succBox.style.display = 'block';
                errBox.style.display = 'none';
                document.getElementById('recoverForm').reset();
            } catch (err) {
                errBox.style.display = 'block';
                errBox.innerText = err.message;
                succBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
